name: CI Python

on:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Instalar dependencias
        run: pip install -r requirements-ci.txt

      - name: Lint (errores de sintaxis y nombres indefinidos)
        run: ruff check --select E9,F63,F7,F82 scripts

      - name: Límite de 100 MB por Parquet (límite de GitHub)
        run: |
          grandes=$(find . -name "*.parquet" -size +100M -not -path "./.git/*")
          if [ -n "$grandes" ]; then
            echo "Parquet mayor a 100 MB:"
            echo "$grandes"
            exit 1
          fi

      - name: Tests
        run: pytest scripts/clasificacion -v
